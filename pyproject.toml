[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-generator-studio"
version = "0.6.3"
description = "Offline AI background music generator for Windows — prompt to loopable track."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-music-generator-studio contributors" }]
keywords = ["music", "ai", "generative", "background-music", "musicgen", "windows"]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "torch>=2.2",
    "transformers>=4.40",
    "audiocraft>=1.3.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    "platformdirs>=4.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
native = ["cffi>=1.16"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.9", "ruff>=0.4", "hypothesis>=6.100"]

[project.scripts]
aims = "ai_music_studio.cli:app"
aims-gui = "ai_music_studio.gui.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["ai_music_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"